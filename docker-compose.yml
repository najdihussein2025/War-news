services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PG_APPLICATION_NAME: war-news-backend
      PIPELINE_ROLE: api
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-exclude scripts/*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - appnet

  pipeline-worker:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PG_APPLICATION_NAME: war-news-pipeline
      PIPELINE_ROLE: worker
    volumes:
      - .:/app
    command: python -m app.core.scripts.run_pipeline_worker
    restart: unless-stopped
    networks:
      - appnet

  red-alert-collector:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PG_APPLICATION_NAME: war-news-red-alert
      PIPELINE_ROLE: red-alert-collector
    volumes:
      - .:/app
    command: python -m app.core.scripts.run_red_alert_collector
    restart: unless-stopped
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    networks:
      - appnet

volumes:
  pgdata:

networks:
  appnet:
    driver: bridge
