# --- Condition ID glossary (IDs remain Python constants; Arabic labels for prompts) ---
# Confirmed B.3 (2026-09-14): routing/filter sets stay code-only. These rows exist so
# PromptBuilder can explain what each special condition looks like in Arabic text.

- term: "غارة تحذيرية / تحذيريه"
  category: condition_id_label
  meaning: "Warning Raid"
  notes: "condition_id=2. Distinguishing token تحذيريه required in matching_service; ID stays in Python."

- term: "طيران حربي / مقاتلات حربية"
  category: condition_id_label
  meaning: "Warplane air violation"
  notes: "condition_id=35. Member of AIR_VIOLATION_CONDITION_IDS; ID stays in Python/SQL."

- term: "طيران استطلاعي / مسيرة / مسير"
  category: condition_id_label
  meaning: "Drone / recon air violation"
  notes: "condition_id=36. Member of AIR_VIOLATION_CONDITION_IDS; ID stays in Python/SQL."

- term: "طيران مروحي / مروحيه / هليكوبتر"
  category: condition_id_label
  meaning: "Helicopter air violation"
  notes: "condition_id=38. Member of AIR_VIOLATION_CONDITION_IDS; ID stays in Python/SQL."

- term: "غارات وهمية / وهميه"
  category: condition_id_label
  meaning: "Feigned Attacks"
  notes: "condition_id=39. Distinguishing token وهميه required; ID stays in Python."

- term: "انتهاك جوي غير مصنف"
  category: condition_id_label
  meaning: "Unclassified air violation"
  notes: "condition_id=45 (UNCLASSIFIED_AIR_CONDITION_ID). Fallback when air phrases do not map to 35/36/38; ID stays in Python."
- term: "civilian fire / car fire / property fire"
  category: exclusion_note
  meaning: "Burning Properties"
  notes: "Do not classify ordinary civilian fires, car fires, electrical faults, traffic accidents, or property fires as Burning Properties unless the text explicitly ties the damage to Israeli, military, or security action."

- term: "استهداف بطائرة مسيرة / مسيّرة استهدفت"
  category: evidence_override
  meaning: "Bombs"
  notes: "Drone-strike wording is an attack/strike condition. Do not map it to Drone Failure; Drone Failure is only for a drone falling/crashing in our territory, e.g. سقوط مسيرة."

- term: "سقوط مسيرة"
  category: condition_id_label
  meaning: "Drone Failure"
  notes: "Use only when the text says a drone fell/crashed, not when a drone targeted or struck a car, building, road, or people."
