# Arabic casualty wording for deterministic (non-LLM) casualty checks.
# Consumed by app/news/services/incident_details/casualty_text.py only.
# Not listed in index.yaml on purpose: these entries do not reach prompts.
# Singular / dual / plural casualty nouns live in casualty_gender.yaml.

# --- Page headers that name a past victim, not a new casualty ---

- term: "صفحة الإعلامي الشهيد علي شعيب"
  category: page_header
  meaning: source_header
  notes: "Seen in ~464 messages (2026-08/09). Tokens before الشهيد are optional in matching."

