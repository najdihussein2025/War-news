tier1_extraction:
  rules:
    core:
      - rules/tier1_general_prompt.md
      - rules/condition_action_reconciliation.md
    situational:
      - trigger: is_multi_village_candidate
        load: rules/tier1_multi_village.md
      - trigger: has_casualty_transition_language
        load: rules/tier1_casualty_transitions.md
  fewshot:
    source: fewshot/village_collision_examples.jsonl
    k: 3
  terminology:
    - terminology/role_terms.yaml
    - terminology/revision_language_markers.yaml
    - terminology/casualty_gender.yaml

# Split-phase Tier 1 (TIER1_SPLIT_PHASES_ENABLED): one call per segment for
# relevance, villages/roles and action only. No numbers, no categories.
tier1_event:
  rules:
    core:
      - rules/tier1_event_prompt.md
  terminology:
    - terminology/role_terms.yaml

# Split-phase Tier 1: casualty numbers for one segment, only when
# casualty_demographics is present in it. Every count needs a literal span.
tier1_casualty:
  rules:
    core:
      - rules/tier1_casualty_prompt.md
    situational:
      - trigger: has_casualty_transition_language
        load: rules/tier1_casualty_transitions.md
  terminology:
    - terminology/revision_language_markers.yaml
    - terminology/casualty_gender.yaml

combined_tier1:
  rules:
    core:
      - rules/combined_tier1_prompt.md
    situational:
      - trigger: is_multi_village_candidate
        load: rules/tier1_multi_village.md
  fewshot:
    source: fewshot/scope_examples.jsonl
    k: 3
  terminology:
    - terminology/org_types.yaml
    - terminology/role_terms.yaml
    - terminology/revision_language_markers.yaml
    - terminology/casualty_gender.yaml

presence_gate:
  rules:
    core:
      - rules/presence_gate_prompt.md
  terminology:
    - terminology/org_types.yaml
    - terminology/role_terms.yaml

# Summary bulletin cross-check (add-only): lists (header, location) pairs the parser missed.
summary_crosscheck:
  rules:
    core:
      - rules/summary_crosscheck_prompt.md

story_revision:
  rules:
    core:
      - rules/story_revision_prompt.md
  terminology:
    - terminology/revision_language_markers.yaml

relevance_filter:
  rules:
    core:
      - rules/relevance_filter_prompt.md

tier2_detail:
  rules:
    core:
      - rules/tier2_category_detail_prompt.md
  terminology:
    - terminology/org_types.yaml
    - terminology/role_terms.yaml
    - terminology/casualty_gender.yaml

tier2_detail_batched:
  rules:
    core:
      - rules/tier2_batched_category_detail_prompt.md
  terminology:
    - terminology/org_types.yaml
    - terminology/role_terms.yaml
    - terminology/casualty_gender.yaml
